name: entre_patas
description: "Entre Patas: adoção responsável de animais com Supabase."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  material_ui: ^1.11.0
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/animais.png
    - assets/cachorro.jpg
    - assets/banners/

  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf

